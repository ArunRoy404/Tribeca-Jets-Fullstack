<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Refused by the API on purpose. An SVG is a document that executes
       script, so serving one from the API's own origin would be stored XSS
       wearing an image's clothes. This fixture exists to prove the refusal. -->
  <script>alert(document.cookie)</script>
  <circle cx="32" cy="32" r="30" fill="#6C4CF1"/>
</svg>
