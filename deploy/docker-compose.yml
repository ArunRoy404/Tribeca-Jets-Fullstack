# Production stack for the Hostinger KVM 2 VPS. Guide: docs/DEPLOYMENT-VPS.md
#
#   Caddy (80/443, automatic HTTPS)
#     ├─ /api/*  → api  (NestJS, :4000)
#     └─ else    → web  (Next.js, :3000)
#   postgres, redis  — internal network only, never published
#   backup           — nightly pg_dump into ./backups
#
# One domain serves both apps, so the session cookie is an ordinary
# first-party cookie: COOKIE_DOMAIN stays empty and no CORS is involved.
#
# Run from this folder:  docker compose up -d --build
# Every value comes from ./.env (copy .env.example).
name: tribeca

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them,
      # and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build: ../Backend
    restart: unless-stopped
    env_file: .env
    # Fixed for production, set here so .env cannot get them wrong.
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_PREFIX: api
      DATABASE_URL: postgresql://tribeca:${POSTGRES_PASSWORD}@postgres:5432/tribeca_jets?schema=public
      REDIS_URL: redis://redis:6379
      WEB_APP_URL: https://${DOMAIN}
      API_PUBLIC_URL: https://${DOMAIN}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      STORAGE_DRIVER: s3
      MAIL_DRIVER: smtp
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_MULTIPLIER: '1'
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/health').then(r=>r.json()).then(b=>process.exit(b?.data?.status==='ok'||b?.status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ../Frontend
      args:
        API_PROXY_TARGET: http://api:4000
    restart: unless-stopped
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tribeca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tribeca_jets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tribeca -d tribeca_jets']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist to disk so queued reminders survive a restart.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: tribeca
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tribeca_jets
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
